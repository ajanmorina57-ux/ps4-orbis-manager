# fly.toml app configuration file generated for ps4-orbis-manager on 2026-11-10T22:33:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ps4-orbis-manager'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  WEB_ORIGIN = 'https://your-orbis-manager.vercel.app'

[processes]
  app = 'npm run start --workspace @orbis/server'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[restart]]
  policy = 'on-failure'
  retries = 5
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
